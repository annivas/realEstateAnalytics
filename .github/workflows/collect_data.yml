name: Daily Data Collection

on:
  schedule:
    # Run twice daily at 6 AM and 6 PM UTC
    - cron: '0 6 * * *'   # 6 AM UTC (8 AM Athens, 1 AM EST)
    - cron: '0 18 * * *'  # 6 PM UTC (8 PM Athens, 1 PM EST)
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Allow pushing to repo

jobs:
  collect:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for rebasing
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx sqlalchemy pandas
      
      - name: Run data collection
        run: |
          python scripts/collect_ci.py
        continue-on-error: true  # Don't fail if API has issues
      
      - name: Export data to CSV
        run: |
          python << 'EOF'
          import sqlite3
          import csv
          import os
          
          db_path = "data/real_estate.db"
          if not os.path.exists(db_path):
              print("No database found, skipping export")
              exit(0)
          
          conn = sqlite3.connect(db_path)
          
          print("=" * 50)
          print("DATABASE CONTENTS BEFORE EXPORT:")
          for table in ["agents", "properties", "property_snapshots", "collection_runs"]:
              count = conn.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0]
              print(f"  {table}: {count} rows")
          print("=" * 50)
          
          # Export each table
          for table in ["properties", "property_snapshots", "agents", "collection_runs"]:
              cursor = conn.execute(f"SELECT * FROM {table}")
              columns = [desc[0] for desc in cursor.description]
              rows = cursor.fetchall()
              
              filename = f"data/{table.replace('property_', '')}.csv"
              with open(filename, "w", newline="") as f:
                  writer = csv.writer(f)
                  writer.writerow(columns)
                  writer.writerows(rows)
              
              print(f"Exported {table}: {len(rows)} rows to {filename}")
          
          conn.close()
          
          # Verify exported files
          print("=" * 50)
          print("EXPORTED CSV FILES:")
          for f in ["agents.csv", "properties.csv", "snapshots.csv", "collection_runs.csv"]:
              path = f"data/{f}"
              if os.path.exists(path):
                  with open(path) as file:
                      lines = sum(1 for _ in file) - 1  # minus header
                  print(f"  {f}: {lines} rows")
          print("=" * 50)
          EOF
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Only add CSV data files - never touch code
          git add data/*.csv
          
          # Only commit if there are changes to CSV files
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily data update: $(date +'%Y-%m-%d')"
            
            # Pull and rebase to handle any concurrent changes, then push
            git pull --rebase origin main
            git push origin main
          fi
